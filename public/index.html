<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call Log</title>
<style>
  :root { color-scheme: light dark; --line: #d9d9de; --muted: #6b7280; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 32px 20px; max-width: 760px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .call { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .name { font-weight: 600; }
  .when { color: var(--muted); font-size: 13px; }
  .appt { margin: 10px 0; padding: 8px 12px; border-radius: 6px; background: rgba(127,127,127,.12); }
  .appt b { font-weight: 600; }
  .none { color: var(--muted); font-style: italic; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .line { margin: 6px 0; }
  .line span { color: var(--muted); }
</style>
</head>
<body>
<h1>Call Log</h1>
<p class="sub">Appointments and summaries from the phone agent.</p>
<div id="list">Loading…</div>

<script>
const fmt = (iso) => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
const esc = (s) => String(s ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

async function load() {
  const calls = await fetch("/api/calls").then((r) => r.json());
  const list = document.getElementById("list");

  if (!calls.length) {
    list.innerHTML = '<p class="none">No calls yet. Call the number to create one.</p>';
    return;
  }

  list.innerHTML = calls.map((c) => `
    <div class="call">
      <div class="top">
        <span class="name">${esc(c.caller_name || "Unknown caller")}</span>
        <span class="when">${esc(c.from)} · ${fmt(c.ended_at)} · ${c.duration_seconds}s</span>
      </div>
      <div class="appt">
        ${c.appointment
          ? `<b>Appointment:</b> ${esc(c.appointment)}${c.service ? ` — ${esc(c.service)}` : ""}`
          : '<span class="none">No appointment booked</span>'}
      </div>
      <div>${esc(c.summary)}</div>
      <details>
        <summary>Transcript</summary>
        ${(c.transcript || []).map((m) =>
          `<div class="line"><span>${m.role === "user" ? "Caller" : "Agent"}:</span> ${esc(m.content)}</div>`
        ).join("")}
      </details>
    </div>`).join("");
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
